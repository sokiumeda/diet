<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0F14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Diet Tracker</title>
<style>
  :root{
    --bg: #0B0F14;
    --panel: #121920;
    --border: #1F2A33;
    --border2: #26333D;
    --amber: #E8A33D;
    --cyan: #46D2C0;
    --red: #E5534B;
    --text: #E7EEF3;
    --muted: #7C8B96;
    --mutedDim: #4C5A63;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{
    background:var(--bg);
  }
  html,body{
    margin:0;
    padding:0;
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
    background:var(--bg);
    padding-top:calc(env(safe-area-inset-top) + 10px);
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .num{font-family:var(--mono);}
  #app{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:560px;
    width:100%;
    margin:0 auto;
    padding:12px 14px 24px;
  }

  /* ---- gauge / header panel ---- */
  .panel{
    background:linear-gradient(180deg, #141C24, var(--panel));
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    margin-bottom:10px;
    box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 8px 20px -14px rgba(0,0,0,.6);
  }
  #gaugePanel.panel{
    padding:16px 16px 14px;
  }
  .gauge-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:10px;
    gap:10px;
    flex-wrap:wrap;
  }
  .gauge-stat .label{
    font-size:11px;
    color:var(--muted);
    letter-spacing:.03em;
    margin-bottom:3px;
  }
  .gauge-stat .value{
    font-size:32px;
    font-weight:600;
    color:var(--text);
    letter-spacing:-.01em;
  }
  .gauge-stat .value small{
    font-size:13px;
    color:var(--muted);
    font-weight:400;
  }
  .gauge-stat.accent .value{ color:var(--amber); }
  .spark-wrap{
    height:44px;
    margin:2px 0 12px;
  }
  .spark-wrap canvas{ width:100%; height:100%; display:block; }
  .stats-row{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:10px;
  }
  .mini-stat{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#0E141A;
    border:1px solid var(--border);
    border-radius:9px;
    padding:8px 12px;
    min-width:0;
    transition:border-color .2s;
  }
  .mini-stat .label{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.04em;
    white-space:nowrap;
  }
  .mini-stat .value{
    font-size:14px;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .value-group{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
  }
  .value-group .value{ flex:0 1 auto; }
  .pace-badge{
    flex:0 0 auto;
    font-size:9px;
    font-family:var(--sans);
    padding:2px 7px;
    border-radius:20px;
    white-space:nowrap;
    background:#0B1015;
    border:1px solid var(--border2);
    color:var(--muted);
  }
  .pace-badge.ok{ color:var(--cyan); border-color:rgba(70,210,192,.35); background:rgba(70,210,192,.12); }
  .pace-badge.over{ color:var(--red); border-color:rgba(229,83,75,.35); background:rgba(229,83,75,.12); }

  .gauge-bar-wrap{ margin-top:4px; }
  .gauge-bar{
    position:relative;
    height:14px;
    border-radius:7px;
    background:#0E141A;
    border:1px solid var(--border);
    overflow:hidden;
  }
  .gauge-bar-fill{
    /* anchored to the 90kg (start) end so the fill's leading edge sits at the
       current weight on the tick axis, not at the goal end */
    position:absolute;
    top:0; right:0; bottom:0;
    background:linear-gradient(90deg, var(--cyan), var(--amber));
    border-radius:0 7px 7px 0;
    transition:width .3s ease;
  }
  .gauge-ticks{
    position:relative;
    height:16px;
    margin-top:2px;
  }
  .gauge-ticks .tick{
    position:absolute;
    top:0;
    font-size:9px;
    color:var(--mutedDim);
    font-family:var(--mono);
    transform:translateX(-50%);
  }
  .gauge-labels{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    color:var(--muted);
    margin-top:4px;
  }

  /* ---- tabs ---- */
  .tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    display:flex;
    background:var(--panel);
    border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
    z-index:10;
  }
  .tab-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    font-family:var(--sans);
    font-size:12px;
    padding:10px 0 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
  }
  .tab-btn .icon{ font-size:18px; line-height:1; }
  .tab-btn.active{ color:var(--cyan); }
  .tab-btn.active .icon{ filter:none; }

  .tab-panel{ display:none; flex-direction:column; gap:10px; }
  .tab-panel.active{ display:flex; animation:tabIn .22s ease; }
  @keyframes tabIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  h2.section-title{
    font-size:13px;
    color:var(--muted);
    font-weight:600;
    letter-spacing:.03em;
    margin:2px 0 0;
    text-transform:uppercase;
  }

  /* ---- form ---- */
  .form-row{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .field label{
    font-size:11px;
    color:var(--muted);
  }
  .field input[type="date"],
  .field input[type="number"]{
    background:#0E141A;
    border:1px solid var(--border2);
    color:var(--text);
    border-radius:8px;
    padding:9px 10px;
    font-family:var(--mono);
    font-size:15px;
    width:100%;
    max-width:100%;
    height:44px;
    -webkit-appearance:none;
    appearance:none;
  }
  .field input[type="text"],
  .field select{
    background:#0E141A;
    border:1px solid var(--border2);
    color:var(--text);
    border-radius:8px;
    padding:9px 10px;
    font-family:var(--sans);
    font-size:15px;
    width:100%;
    max-width:100%;
    height:44px;
    -webkit-appearance:none;
    appearance:none;
  }
  /* iOS Safari centers the date value by default, unlike other inputs */
  .field input[type="date"]::-webkit-date-and-time-value{ text-align:left; }
  .field input:focus{ outline:1px solid var(--cyan); }
  .form-bottom-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .toggle-field{
    display:flex;
    align-items:center;
    gap:8px;
    flex:0 0 auto;
  }
  .toggle-field label{
    font-size:11px;
    color:var(--muted);
  }
  .switch{
    position:relative;
    width:42px;
    height:24px;
    flex-shrink:0;
  }
  .switch input{
    opacity:0;
    width:0;
    height:0;
  }
  .switch .slider{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    background:#0E141A;
    border:1px solid var(--border2);
    border-radius:24px;
    cursor:pointer;
    transition:.2s;
  }
  .switch .slider::before{
    content:"";
    position:absolute;
    height:18px;
    width:18px;
    left:2px;
    top:2px;
    background:var(--mutedDim);
    border-radius:50%;
    transition:.2s;
  }
  .switch input:checked + .slider{ background:rgba(70,210,192,.15); border-color:var(--cyan); }
  .switch input:checked + .slider::before{ background:var(--cyan); transform:translateX(18px); }

  .btn{
    background:var(--cyan);
    color:#04201C;
    border:none;
    border-radius:9px;
    padding:10px 18px;
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{ opacity:.8; transform:scale(.98); }
  .btn.secondary{
    background:#0E141A;
    color:var(--text);
    border:1px solid var(--border2);
  }
  .btn.secondary:active{ opacity:.7; }
  .btn.full{ width:100%; }

  /* ---- data management ---- */
  .data-actions{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .data-hint{
    font-size:11px;
    color:var(--muted);
    line-height:1.6;
    margin:0 0 2px;
  }
  .data-status{
    font-size:12px;
    min-height:16px;
    margin-top:2px;
  }
  .data-status.ok{ color:var(--cyan); }
  .data-status.err{ color:var(--red); }

  /* ---- history ---- */
  .history-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:420px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .history-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
  }
  .history-row .date{
    font-family:var(--mono);
    font-size:13px;
    color:var(--muted);
    flex:0 0 88px;
  }
  .history-row .weight{
    font-family:var(--mono);
    font-size:15px;
    color:var(--text);
    flex:0 0 68px;
  }
  .history-row .trained-badge{
    font-size:11px;
    padding:2px 7px;
    border-radius:5px;
    font-family:var(--sans);
    flex:0 0 auto;
  }
  .trained-badge.yes{
    background:rgba(70,210,192,.14);
    color:var(--cyan);
    border:1px solid rgba(70,210,192,.35);
  }
  .trained-badge.no{
    background:transparent;
    color:var(--mutedDim);
    border:1px solid var(--border2);
  }
  .macro-badge{
    font-size:11px;
    color:var(--amber);
    font-family:var(--mono);
    white-space:nowrap;
    flex:0 0 auto;
  }
  .history-row .spacer{ flex:1; }
  .del-btn{
    background:none;
    border:1px solid var(--border2);
    color:var(--muted);
    border-radius:6px;
    width:32px;
    height:32px;
    font-size:15px;
    line-height:1;
    cursor:pointer;
  }
  .del-btn:active{ color:var(--red); border-color:var(--red); }

  .history-meals{padding:6px 0 10px 8px;border-bottom:1px solid rgba(255,255,255,.06)}
  .history-meal-row{display:flex;gap:8px;font-size:12px;color:#b9bec7;padding:2px 0}
  .history-meal-row .hm-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .history-meal-row.empty{color:#6b7078}

  .empty-state{
    color:var(--muted);
    font-size:13px;
    padding:26px 10px;
    text-align:center;
    border:1px dashed var(--border2);
    border-radius:10px;
  }

  /* ---- frequent-food chips ---- */
  .food-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .food-chip{background:#20242b;border:1px solid #333a44;color:#e6e9ee;border-radius:14px;padding:6px 10px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
  .food-chip-macro{font-size:11px;color:#8a8f98}

  /* ---- recipe search ---- */
  .recipe-search{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:10px 0 14px;
  }
  .recipe-search-input{
    background:#0E141A;
    border:1px solid var(--border2);
    color:var(--text);
    border-radius:8px;
    padding:9px 10px;
    font-family:var(--sans);
    font-size:14px;
    width:100%;
    max-width:100%;
    height:40px;
    -webkit-appearance:none;
    appearance:none;
  }
  .recipe-search-input:focus{ outline:1px solid var(--cyan); }
  .recipe-search-input::-webkit-search-cancel-button{ -webkit-appearance:none; }
  .recipe-filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .recipe-filter-select{
    flex:1 1 auto;
    min-width:0;
    background:#0E141A;
    border:1px solid var(--border2);
    color:var(--text);
    border-radius:8px;
    padding:8px 6px;
    font-family:var(--sans);
    font-size:12px;
    height:36px;
    -webkit-appearance:none;
    appearance:none;
  }
  .recipe-filter-clear{
    flex:0 0 auto;
    padding:0 14px;
    height:36px;
    font-size:12px;
  }
  .recipe-search-note{
    font-size:11px;
    color:var(--muted);
    line-height:1.5;
  }
  .search-count{
    font-size:12px;
    color:var(--muted);
    margin-bottom:8px;
  }
  .search-result-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .search-result-row{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:4px 10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
  }
  .search-result-row:active{ background:#0E141A; }
  .search-result-row .srr-time{
    flex:0 0 auto;
    font-size:10px;
    color:var(--cyan);
    text-transform:uppercase;
    letter-spacing:.04em;
    border:1px solid rgba(70,210,192,.35);
    border-radius:5px;
    padding:2px 6px;
  }
  .search-result-row .srr-name{
    flex:1 1 140px;
    min-width:0;
    font-size:13px;
    color:var(--text);
  }
  .search-result-row .srr-macro{
    flex:0 0 auto;
    font-size:12px;
    color:var(--muted);
    font-family:var(--mono);
    white-space:nowrap;
  }
  .search-result-row .srr-tags{
    flex:1 1 100%;
    font-size:10px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .recipe-tag-chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    max-height:76px;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }
  .recipe-tag-chip{
    flex:0 0 auto;
    background:#0E141A;
    border:1px solid var(--border2);
    color:var(--muted);
    border-radius:999px;
    padding:5px 11px;
    font-family:var(--sans);
    font-size:11px;
    white-space:nowrap;
    cursor:pointer;
  }
  .recipe-tag-chip.active{
    color:var(--cyan);
    border-color:rgba(70,210,192,.5);
    background:rgba(70,210,192,.12);
  }

  /* ---- chart ---- */
  .chart-wrap{
    position:relative;
    width:100%;
    height:280px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px;
  }
  canvas#weightChart{
    width:100%;
    height:100%;
    display:block;
  }

  /* ---- chart toggle ---- */
  .chart-toggle{
    display:flex;
    gap:6px;
    background:#0E141A;
    border:1px solid var(--border);
    border-radius:10px;
    padding:4px;
  }
  .seg-btn{
    flex:1;
    background:none;
    border:none;
    color:var(--muted);
    font-family:var(--sans);
    font-size:12px;
    font-weight:600;
    padding:8px 0;
    border-radius:7px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .seg-btn.active{
    background:var(--panel);
    color:var(--cyan);
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }

  /* ---- today's target ---- */
  .target-row{ margin-bottom:10px; }
  .target-row:last-child{ margin-bottom:0; }
  .target-row-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:5px;
  }
  .target-label{
    font-size:12px;
    color:var(--muted);
  }
  .target-value{
    font-size:13px;
    color:var(--text);
  }
  .target-value.over{ color:var(--red); }
  .target-bar{
    position:relative;
    height:8px;
    border-radius:5px;
    background:#0E141A;
    border:1px solid var(--border);
    overflow:hidden;
  }
  .target-bar-fill{
    position:absolute;
    top:0; left:0; bottom:0;
    background:linear-gradient(90deg, var(--cyan), var(--amber));
    border-radius:5px;
    transition:width .3s ease;
  }
  .target-bar-fill.over{ background:var(--red); }

  .meal-bucket{margin-top:12px}
  .meal-bucket-label{font-size:12px;color:#8a8f98;margin-bottom:4px}
  .meal-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .meal-row.empty{color:#6b7078;font-size:13px}
  #todayTargetCard .meal-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meal-macro{font-size:13px;color:#b9bec7}
  .meal-del{background:none;border:none;color:#8a8f98;font-size:18px;padding:0 4px;cursor:pointer}

  /* ---- meals ---- */
  .meal-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 14px;
  }
  .meal-card .meal-time{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:3px;
  }
  .meal-card .meal-name{
    font-size:15px;
    color:var(--text);
    margin-bottom:6px;
    line-height:1.35;
  }
  .meal-card .meal-macros{
    display:flex;
    gap:16px;
  }
  .meal-macros .macro .num{
    font-size:16px;
    color:var(--amber);
  }
  .meal-macros .macro .label{
    font-size:10px;
    color:var(--muted);
    text-transform:uppercase;
  }
  .summary-card{
    background:#0E141A;
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 14px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  .summary-card .item .label{
    font-size:10px;
    color:var(--muted);
    text-transform:uppercase;
    margin-bottom:2px;
  }
  .summary-card .item .value{
    font-size:18px;
    color:var(--text);
  }
  .summary-card .item .value.over{ color:var(--red); }
  .summary-card .item .value.ok{ color:var(--cyan); }

  details.all-menu{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 14px;
  }
  details.all-menu summary{
    cursor:pointer;
    font-size:13px;
    color:var(--cyan);
    padding:4px 0;
  }
  .menu-group{ margin-top:10px; }
  .menu-group h3{
    font-size:12px;
    color:var(--muted);
    text-transform:uppercase;
    margin:10px 0 6px;
  }
  .menu-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding:8px 4px;
    border-bottom:1px solid var(--border);
    font-size:13px;
    cursor:pointer;
  }
  .menu-item:active{ background:#0E141A; }
  .menu-item:last-child{ border-bottom:none; }
  .menu-item .mname{ color:var(--text); flex:1; }
  .menu-item .mmacro{ color:var(--muted); font-family:var(--mono); font-size:12px; white-space:nowrap; }

  /* ---- recipe modal ---- */
  .meal-card{ cursor:pointer; }
  .meal-card:active{ border-color:var(--border2); }
  .meal-card .recipe-hint{
    margin-top:8px;
    font-size:11px;
    color:var(--cyan);
  }
  .recipe-overlay{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(4,6,9,.65);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }

  .toast.show{display:flex}

</style>

<body>

<div id="app">
  <div class="panel" id="gaugePanel"></div>

  <h2 class="section-title">本日の摂取</h2>
  <div class="panel" id="todayTargetCard"></div>

  <div class="tab-panel active" id="tab-dashboard">
    <h2 class="section-title">体重を記録</h2>

      <form id="logForm">
        <div class="form-row">
          <div class="field">
            <label for="f-date">日付</label>

              </label>
            </div>
            <button type="submit" class="btn">追加</button>
          </div>
        </div>

    <h2 class="section-title">食事を追加</h2>
    <div class="panel">
      <div class="food-chips" id="foodChips"></div>
      <form id="mealForm">
        <div class="form-row">
          <div class="field">
            <label for="m-time">食事帯</label>
            <select id="m-time">
              <option value="breakfast">朝食</option>
              <option value="lunch">昼食</option>
              <option value="dinner">夕食</option>
              <option value="snack">間食</option>
            </select>
          </div>
          <div class="field">
            <label for="m-date">日付</label>
            <input type="date" id="m-date">
          </div>
          <div class="field">
            <label for="m-name">名前</label>
            <input type="text" id="m-name" placeholder="例: コンビニのサラダチキン">
          </div>
          <div class="field">
            <label for="m-kcal">カロリー (kcal)</label>
            <input type="number" id="m-kcal" step="1" min="0" inputmode="numeric">
          </div>
          <div class="field">
            <label for="m-protein">タンパク質 (任意)</label>
            <input type="number" id="m-protein" step="1" min="0" inputmode="numeric" placeholder="g">
          </div>
          <button type="submit" class="btn full">食事を追加</button>
          <div class="data-status" id="mealStatus"></div>
        </div>
      </form>
    </div>

    <h2 class="section-title">履歴</h2>
    <div id="historyList"></div>

    <h2 class="section-title">目標設定</h2>
    <div class="panel">
      <div class="form-row">
        <div class="field">
          <label for="s-calories">目標カロリー (kcal/日)</label>
          <input type="number" id="s-calories" step="10" min="0">
        </div>
        <div class="field">
          <label for="s-protein">目標タンパク質 (g/日)</label>
          <input type="number" id="s-protein" step="1" min="0">
        </div>
        <button type="button" class="btn secondary full" id="settingsSaveBtn">保存</button>
        <div class="data-status" id="settingsStatus"></div>
      </div>
    </div>

    <h2 class="section-title">データ管理</h2>
    <div class="panel">
      <div class="data-actions">
        <p class="data-hint">記録と設定をJSONファイルに書き出せます。端末変更やlocalStorage消失に備えて、定期的なエクスポートをおすすめします。</p>
        <button type="button" class="btn secondary full" id="exportBtn">JSONをエクスポート</button>
        <button type="button" class="btn secondary full" id="importBtn">JSONからインポート</button>
        <input type="file" id="importFile" accept="application/json,.json" style="display:none">
        <div class="data-status" id="dataStatus"></div>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="tab-chart">
    <h2 class="section-title">推移</h2>
    <div class="chart-toggle" id="chartToggle">
      <button class="seg-btn active" data-metric="weight">体重</button>
      <button class="seg-btn" data-metric="calories">カロリー</button>
      <button class="seg-btn" data-metric="protein">タンパク質</button>
    </div>
    <div id="chartArea"></div>
  </div>

  <div class="tab-panel" id="tab-meals">
    <h2 class="section-title">今日の食事例</h2>
    <div class="recipe-search">
      <input type="search" id="recipeSearchInput" class="recipe-search-input" placeholder="レシピ名・材料で検索">
      <div class="recipe-filter-row">
        <select id="recipeFilterKcal" class="recipe-filter-select">
          <option value="0">カロリー: 制限なし</option>
          <option value="350">〜350 kcal</option>
          <option value="400">〜400 kcal</option>
          <option value="450">〜450 kcal</option>
          <option value="500">〜500 kcal</option>
        </select>
        <select id="recipeFilterProtein" class="recipe-filter-select">
          <option value="0">タンパク質: 制限なし</option>
          <option value="30">30g+</option>
          <option value="35">35g+</option>
          <option value="40">40g+</option>
          <option value="45">45g+</option>
        </select>
        <button type="button" id="recipeFilterClear" class="btn secondary recipe-filter-clear">クリア</button>
      </div>
      <div class="recipe-tag-chips" id="recipeTagChips"></div>
      <div class="recipe-search-note">カロリー・タンパク質は目安です。正確な記録は食品の栄養成分表示をご確認ください。</div>
    </div>
    <div id="mealsArea"></div>
  </div>

  <div class="app-version" id="appVersion"></div>
</div>

<div class="tabbar">
  <button class="tab-btn active" data-tab="dashboard"><span class="icon">&#9998;</span>記録</button>
  <button class="tab-btn" data-tab="chart"><span class="icon">&#128200;</span>推移</button>
  <button class="tab-btn" data-tab="meals"><span class="icon">&#127860;</span>食事例</button>
</div>

<div class="recipe-overlay" id="recipeOverlay">
  <div class="recipe-modal">
    <button class="recipe-close" id="recipeClose" aria-label="閉じる">&times;</button>
    <div class="recipe-time" id="recipeTime"></div>
    <div class="recipe-title" id="recipeTitle"></div>
    <div class="recipe-macros" id="recipeMacros"></div>
    <button class="recipe-log-btn" id="recipeLogBtn" type="button">記録に追加</button>
    <h4>材料</h4>
    <ul class="recipe-ingredients" id="recipeIngredients"></ul>
    <h4>作り方</h4>
    <ol class="recipe-steps" id="recipeSteps"></ol>
  </div>
</div>

<div class="recipe-overlay welcome-overlay" id="welcomeOverlay">
  <div class="welcome-card">
    <div class="recipe-time">WELCOME</div>
    <div class="recipe-title">減量の記録を始めましょう</div>
    <p class="welcome-text">現在の体重と目標体重を入力してください。今日の体重が最初の記録として保存されます。</p>
    <div class="field">
      <label for="w-current">現在の体重 (kg)</label>
      <input type="number" id="w-current" step="0.1" min="0" placeholder="90.0">
    </div>
    <div class="field" style="margin-top:10px;">
      <label for="w-goal">目標体重 (kg)</label>
      <input type="number" id="w-goal" step="0.1" min="0" placeholder="65.0">
    </div>
    <div class="welcome-error" id="welcomeError"></div>
    <button type="button" class="btn welcome-start" id="welcomeStart">記録を開始する</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "nexra-diet-tracker";
  var APP_VERSION = "3.0";

  // ---- self-test harness (activated by ?selftest=1) ----
  var T = {
    eq: function (a, b, msg) {
      if (a !== b) throw new Error((msg || "eq") + ": expected " + JSON.stringify(b) + " but got " + JSON.stringify(a));
    },
    deepEq: function (a, b, msg) {
      var sa = JSON.stringify(a), sb = JSON.stringify(b);
      if (sa !== sb) throw new Error((msg || "deepEq") + ": expected " + sb + " but got " + sa);
    },
    ok: function (cond, msg) {
      if (!cond) throw new Error((msg || "ok") + ": expected truthy");
    },
    throws: function (fn, msg) {
      var threw = false;
      try { fn(); } catch (e) { threw = true; }
      if (!threw) throw new Error((msg || "throws") + ": expected function to throw");
    }
  };

  var SELFTEST = {
    cases: [],
    add: function (name, fn) { SELFTEST.cases.push({ name: name, fn: fn }); },
    run: function () {
      var passed = 0, failed = 0, rows = "";
      SELFTEST.cases.forEach(function (c) {
        var ok = true, err = "";
        try { c.fn(); } catch (e) { ok = false; err = e.message; }
        if (ok) { passed++; } else { failed++; }
        rows += '<div style="padding:6px 10px;border-bottom:1px solid #333;color:' +
          (ok ? "#7ddb7d" : "#ff6b6b") + '">' + (ok ? "PASS" : "FAIL") + " — " + c.name +
          (ok ? "" : '<div style="color:#ffb4b4;font-size:12px;margin-top:4px">' + err + "</div>") + "</div>";
      });
      document.body.innerHTML =
        '<div style="font-family:monospace;background:#111;color:#eee;min-height:100vh;padding:16px">' +
        '<h1 style="font-size:18px">selftest: ' + passed + " passed, " + failed + " failed</h1>" +
        rows + "</div>";
      document.title = (failed === 0 ? "PASS" : "FAIL") + " selftest (" + passed + "/" + (passed + failed) + ")";
      return failed === 0;
    }
  };

  // Dummy test to verify harness works
  SELFTEST.add("harness works", function () {
    T.eq(1 + 1, 2, "arithmetic");
    T.throws(function () { T.eq(1, 2); }, "failing assertion throws");
  });

  SELFTEST.add("dayKcal sums meal calories", function () {
    T.eq(dayKcal({ meals: [{ kcal: 420 }, { kcal: 340 }] }), 760, "sum");
    T.eq(dayKcal({ meals: [] }), 0, "empty");
    T.eq(dayKcal({}), 0, "no meals key");
  });

  SELFTEST.add("dayProtein treats missing protein as zero", function () {
    T.eq(dayProtein({ meals: [{ kcal: 420, protein: 45 }, { kcal: 200 }] }), 45, "missing protein counts as 0");
  });

  SELFTEST.add("hasMeals distinguishes unrecorded from zero", function () {
    T.eq(hasMeals({ meals: [] }), false, "empty means unrecorded");
    T.eq(hasMeals({}), false, "absent means unrecorded");
    T.eq(hasMeals({ meals: [{ kcal: 0 }] }), true, "a zero-kcal meal is still a record");
  });

  SELFTEST.add("defaultMealTime picks bucket from clock", function () {
    T.eq(defaultMealTime(new Date("2026-09-03T08:00:00")), "breakfast", "morning");
    T.eq(defaultMealTime(new Date("2026-09-03T12:30:00")), "lunch", "midday");
    T.eq(defaultMealTime(new Date("2026-09-03T19:00:00")), "dinner", "evening");
    T.eq(defaultMealTime(new Date("2026-09-03T23:00:00")), "snack", "late night");
  });

  SELFTEST.add("migrate converts v1 daily totals into one 'other' meal", function () {
    var v1 = { logs: [{ date: "2026-09-01", weight: 72.4, trained: true, calories: 1200, protein: 90 }] };
    var v2 = migrateToV2(v1);
    T.eq(v2.schemaVersion, 2, "version stamped");
    T.eq(v2.logs[0].meals.length, 1, "one meal");
    T.eq(v2.logs[0].meals[0].time, "other", "bucket");
    T.eq(v2.logs[0].meals[0].kcal, 1200, "kcal preserved");
    T.eq(v2.logs[0].meals[0].protein, 90, "protein preserved");
    T.eq(v2.logs[0].meals[0].source, "migrated", "source");
    T.eq(v2.logs[0].weight, 72.4, "weight untouched");
    T.eq(v2.logs[0].trained, true, "trained untouched");
    T.eq(v2.logs[0].calories, undefined, "old field removed");
    T.eq(v2.logs[0].protein, undefined, "old field removed");
  });

  SELFTEST.add("migrate handles calories-only, protein-only and empty days", function () {
    var v2 = migrateToV2({ logs: [
      { date: "2026-09-01", weight: 72, calories: 1200 },
      { date: "2026-09-02", weight: 72, protein: 80 },
      { date: "2026-09-03", weight: 72 }
    ] });
    T.eq(v2.logs[0].meals[0].protein, undefined, "no fabricated protein");
    T.eq(v2.logs[1].meals[0].kcal, 0, "protein-only day gets zero kcal");
    T.eq(v2.logs[1].meals[0].protein, 80, "protein kept");
    T.deepEq(v2.logs[2].meals, [], "day with neither gets empty meals");
  });

  SELFTEST.add("migrate preserves totals exactly", function () {
    var v1 = { logs: [
      { date: "2026-09-01", weight: 72, calories: 1200, protein: 90 },
      { date: "2026-09-02", weight: 72, calories: 1450, protein: 105 }
    ] };
    var before = v1.logs.reduce(function (s, l) { return s + (l.calories || 0); }, 0);
    var v2 = migrateToV2(v1);
    var after = v2.logs.reduce(function (s, l) { return s + dayKcal(l); }, 0);
    T.eq(after, before, "total kcal unchanged");
  });

  SELFTEST.add("migrate is idempotent and leaves v2 data alone", function () {
    var once = migrateToV2({ logs: [{ date: "2026-09-01", weight: 72, calories: 1200 }] });
    var twice = migrateToV2(once);
    T.deepEq(twice, once, "second pass changes nothing");
    T.eq(twice.logs[0].meals.length, 1, "no duplicated meal");
  });

  SELFTEST.add("migrate does not mutate its input", function () {
    var v1 = { logs: [{ date: "2026-09-01", weight: 72, calories: 1200 }] };
    migrateToV2(v1);
    T.eq(v1.logs[0].calories, 1200, "input untouched");
  });

  SELFTEST.add("migrate initialises foods and preserves profile", function () {
    var v2 = migrateToV2({ logs: [], profile: { startWeight: 80, goalWeight: 65 } });
    T.deepEq(v2.foods, [], "foods initialised");
    T.eq(v2.profile.goalWeight, 65, "profile preserved");
  });

  SELFTEST.add("migrate tolerates empty and malformed input", function () {
    T.deepEq(migrateToV2({}).logs, [], "no logs key");
    T.deepEq(migrateToV2({ logs: [] }).logs, [], "empty logs");
  });

  SELFTEST.add("newId produces unique ids with prefix", function () {
    var a = newId("m_"), b = newId("m_");
    T.ok(a.indexOf("m_") === 0, "prefix");
    T.ok(a !== b, "unique within same millisecond");
  });

  SELFTEST.add("backupOnce writes once and never overwrites", function () {
    var K = "selftest-backup-probe";
    localStorage.removeItem(K);
    T.eq(backupOnce(K, "first"), true, "first call backs up and returns true");
    T.eq(localStorage.getItem(K), "first", "value stored");
    T.eq(backupOnce(K, "second"), false, "second call returns false");
    T.eq(localStorage.getItem(K), "first", "original value untouched");
    localStorage.removeItem(K);
    T.eq(backupOnce(K, ""), false, "falsy raw returns false");
    T.eq(localStorage.getItem(K), null, "falsy raw stores nothing");
    localStorage.removeItem(K);
  });

  SELFTEST.add("addOrUpdateLog merges instead of replacing", function () {
    var saved = state.logs;
    state.logs = [{ date: "2026-09-01", weight: 72, trained: false,
      meals: [{ id: "m_1", time: "lunch", name: "テスト", kcal: 500 }] }];
    var realSave = saveState; saveState = function () {};
    addOrUpdateLog("2026-09-01", 71.8, true);
    T.eq(state.logs[0].meals.length, 1, "meals survive a weight update");
    T.eq(state.logs[0].meals[0].kcal, 500, "meal contents intact");
    T.eq(state.logs[0].weight, 71.8, "weight updated");
    T.eq(state.logs[0].trained, true, "trained updated");
    saveState = realSave; state.logs = saved;
  });

  SELFTEST.add("addOrUpdateLog creates a new day with empty meals", function () {
    var saved = state.logs; state.logs = [];
    var realSave = saveState; saveState = function () {};
    addOrUpdateLog("2026-09-02", 70.2, false);
    T.deepEq(state.logs[0].meals, [], "new day starts with no meals");
    saveState = realSave; state.logs = saved;
  });

  SELFTEST.add("computeGaugeStats/renderGauge skip a weightless day for weight-derived stats", function () {
    var saved = state.logs;
    state.logs = [
      { date: "2026-08-01", weight: 80, trained: false, meals: [] },
      { date: "2026-08-08", weight: 78.6, trained: false, meals: [] },
      { date: "2026-08-15", trained: true, meals: [{ id: "m_1", time: "lunch", name: "朝食", kcal: 400 }] }
    ];
    var s = computeGaugeStats();
    T.eq(s.hasWeight, true, "a weight-bearing day exists");
    T.eq(s.currentWeight, 78.6, "latest weight-bearing day used, not the weightless (most recent) day");
    T.ok(Math.abs(s.weeklyPace - 1.4) < 0.0001, "weeklyPace computed only from the two weight-bearing days");
    T.ok(!isNaN(s.progressPct), "progressPct is a real number");
    T.ok(!isNaN(s.remaining), "remaining is a real number");
    renderGauge();
    T.ok(document.getElementById("gaugePanel").innerHTML.indexOf("NaN") === -1, "gauge markup has no NaN");
    state.logs = saved;
  });

  SELFTEST.add("computeGaugeStats/renderGauge show a placeholder when no day has a weight yet", function () {
    var saved = state.logs;
    state.logs = [
      { date: "2026-08-01", trained: false, meals: [{ id: "m_1", time: "lunch", name: "テスト", kcal: 400 }] },
      { date: "2026-08-02", trained: true, meals: [] }
    ];
    var s = computeGaugeStats();
    T.eq(s.hasWeight, false, "no log has a recorded weight");
    T.eq(s.currentWeight, getStartWeight(), "falls back to the start weight instead of undefined");
    T.eq(s.weeklyPace, null, "no pace can be computed without weight data");
    T.eq(s.progressPct, 0, "progress bar stays at 0, not NaN");
    T.ok(!isNaN(s.remaining), "remaining is a real number, not NaN");
    renderGauge();
    T.ok(document.getElementById("gaugePanel").innerHTML.indexOf("NaN") === -1, "gauge markup has no NaN");
    state.logs = saved;
  });

  SELFTEST.add("addMeal appends to the right day and returns an id", function () {
    var saved = state.logs; state.logs = [];
    var realSave = saveState; saveState = function () {};
    var id = addMeal("2026-09-03", "lunch", "サラダチキン", 110, 25, "manual");
    T.eq(state.logs.length, 1, "day created");
    T.eq(state.logs[0].meals[0].name, "サラダチキン", "meal stored");
    T.eq(state.logs[0].meals[0].kcal, 110, "kcal stored");
    T.eq(state.logs[0].weight, undefined, "no weight fabricated");
    T.ok(id && id.indexOf("m_") === 0, "returns id");
    saveState = realSave; state.logs = saved;
  });

  SELFTEST.add("addMeal omits protein when not given", function () {
    var saved = state.logs; state.logs = [];
    var realSave = saveState; saveState = function () {};
    addMeal("2026-09-03", "snack", "コーヒー", 5, undefined, "manual");
    T.eq(state.logs[0].meals[0].protein, undefined, "protein not fabricated");
    saveState = realSave; state.logs = saved;
  });

  SELFTEST.add("removeMeal deletes only the targeted meal", function () {
    var saved = state.logs; state.logs = [];
    var realSave = saveState; saveState = function () {};
    var a = addMeal("2026-09-03", "lunch", "A", 100, 10, "manual");

  var MEAL_TIME_LABEL = { breakfast: "朝食", lunch: "昼食", dinner: "夕食" };
  var MEAL_TIME_ORDER = ["breakfast", "lunch", "dinner"];

  var LOG_MEAL_TIME_LABEL = { breakfast: "朝食", lunch: "昼食", dinner: "夕食", snack: "間食", other: "その他" };
  var LOG_MEAL_TIME_ORDER = ["breakfast", "lunch", "dinner", "snack", "other"];

  function hasMeals(log) {
    return !!(log && Array.isArray(log.meals) && log.meals.length > 0);
  }

  function dayKcal(log) {
    if (!log || !Array.isArray(log.meals)) return 0;
    return log.meals.reduce(function (s, m) { return s + (typeof m.kcal === "number" ? m.kcal : 0); }, 0);
  }

  function dayProtein(log) {
    if (!log || !Array.isArray(log.meals)) return 0;
    return log.meals.reduce(function (s, m) { return s + (typeof m.protein === "number" ? m.protein : 0); }, 0);
  }

  function defaultMealTime(date) {
    var d = date || new Date();
    var mins = d.getHours() * 60 + d.getMinutes();
    if (mins < 10 * 60 + 30) return "breakfast";
    if (mins < 15 * 60) return "lunch";
    if (mins < 21 * 60) return "dinner";
    return "snack";
  }

  // deterministic per-date hash so "today's menu" is reproducible / stable across reloads
  function dailyIndex(dateStr, mealTime, poolSize) {
    var hash = 0;
    var seed = dateStr + mealTime;
    for (var i = 0; i < seed.length; i++) hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
    return hash % poolSize;
  }

  var BACKUP_KEY_V1 = "nexra-diet-tracker-backup-v1";
  var idCounter = 0;

  function newId(prefix) {
    idCounter++;
    return prefix + Date.now() + "_" + idCounter;
  }

  function migrateToV2(parsed) {
    if (!parsed || typeof parsed !== "object") return { schemaVersion: 2, logs: [], foods: [] };
    if (parsed.schemaVersion) return parsed;

    var logs = Array.isArray(parsed.logs) ? parsed.logs : [];
    var out = { schemaVersion: 2, logs: [], foods: Array.isArray(parsed.foods) ? parsed.foods : [] };
    if (parsed.profile) out.profile = parsed.profile;

    logs.forEach(function (l) {
      var entry = { date: l.date, trained: !!l.trained, meals: [] };
      if (typeof l.weight === "number") entry.weight = l.weight;
      var hasCal = typeof l.calories === "number";
      var hasPro = typeof l.protein === "number";
      if (hasCal || hasPro) {
        var meal = {
          id: newId("m_"), time: "other", name: "まとめて記録（移行）",
          kcal: hasCal ? l.calories : 0, source: "migrated"
        };
        if (hasPro) meal.protein = l.protein;
        entry.meals.push(meal);
      }
      out.logs.push(entry);
    });
    return out;
  }

  var state = { logs: [], foods: [], profile: null, schemaVersion: 2 };

  function backupOnce(storageKey, raw) {
    if (!raw) return false;
    if (localStorage.getItem(storageKey)) return false;
    localStorage.setItem(storageKey, raw);
    return true;
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var parsed = JSON.parse(raw);
      var needsMigration = parsed && !parsed.schemaVersion;
      if (needsMigration) backupOnce(BACKUP_KEY_V1, raw);   // 退避は一度だけ・既存があれば上書きしない
      var data = migrateToV2(parsed);
      if (Array.isArray(data.logs)) state.logs = data.logs;
      if (Array.isArray(data.foods)) state.foods = data.foods;
      if (data.profile && typeof data.profile.startWeight === "number" && typeof data.profile.goalWeight === "number") {
        state.profile = data.profile;
      }
      if (needsMigration) saveState();
    } catch (e) {
      state.logs = [];
      state.foods = [];
    }
  }

  function saveState() {
    var data = { schemaVersion: 2, logs: state.logs, foods: state.foods };
    if (state.profile) data.profile = state.profile;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function sortedLogsAsc() {
    return state.logs.slice().sort(function (a, b) {
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
  }

  function todayStr() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function addOrUpdateLog(date, weight, trained) {
    var idx = state.logs.findIndex(function (l) { return l.date === date; });
    if (idx >= 0) {
      state.logs[idx].weight = Math.round(weight * 10) / 10;
      state.logs[idx].trained = !!trained;
      if (!Array.isArray(state.logs[idx].meals)) state.logs[idx].meals = [];
    } else {
      state.logs.push({ date: date, weight: Math.round(weight * 10) / 10, trained: !!trained, meals: [] });
    }
    saveState();
  }

  function deleteLog(date) {
    state.logs = state.logs.filter(function (l) { return l.date !== date; });
    saveState();
  }

  function normalizeFoodName(name) {
    return String(name == null ? "" : name).trim().toLowerCase();
  }

  function findOrCreateLog(date) {
    var idx = state.logs.findIndex(function (l) { return l.date === date; });
    if (idx >= 0) {
      if (!Array.isArray(state.logs[idx].meals)) state.logs[idx].meals = [];
      return state.logs[idx];
    }
    var entry = { date: date, trained: false, meals: [] };
    state.logs.push(entry);
    return entry;
  }

  function addMeal(date, time, name, kcal, protein, source) {
    var log = findOrCreateLog(date);
    var meal = {
      id: newId("m_"), time: time, name: String(name).trim(),
      kcal: Math.round(kcal), source: source || "manual"
    };
    if (typeof protein === "number" && !isNaN(protein)) meal.protein = Math.round(protein);
    log.meals.push(meal);
    saveState();
    return meal.id;
  }

  function removeMeal(date, id) {
    var log = state.logs.find(function (l) { return l.date === date; });
    if (!log || !Array.isArray(log.meals)) return false;
    var before = log.meals.length;
    log.meals = log.meals.filter(function (m) { return m.id !== id; });
    if (log.meals.length === before) return false;
    saveState();
    return true;
  }

  function upsertFood(name, kcal, protein) {
    var key = normalizeFoodName(name);
    var existing = state.foods.find(function (f) { return normalizeFoodName(f.name) === key; });
    var now = new Date().toISOString();
    if (existing) {
      existing.useCount = (existing.useCount || 0) + 1;
      existing.kcal = Math.round(kcal);
      if (typeof protein === "number" && !isNaN(protein)) existing.protein = Math.round(protein);
      existing.lastUsedAt = now;
      saveState();
      return existing;
    }
    var food = { id: newId("f_"), name: String(name).trim(), kcal: Math.round(kcal), useCount: 1, lastUsedAt: now };
    if (typeof protein === "number" && !isNaN(protein)) food.protein = Math.round(protein);
    state.foods.push(food);
    saveState();
    return food;
  }

  function topFoods(limit) {
    return state.foods.slice().sort(function (a, b) {
      if ((b.useCount || 0) !== (a.useCount || 0)) return (b.useCount || 0) - (a.useCount || 0);
      return String(b.lastUsedAt || "") < String(a.lastUsedAt || "") ? -1 : 1;
    }).slice(0, limit || 12);
  }

  function fmt1(n) {
    return n.toFixed(1);
  }

  function daysBetween(dateA, dateB) {
    var a = new Date(dateA + "T00:00:00");
    var b = new Date(dateB + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }

  function prevDateStr(dateStr) {
    var d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() - 1);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function computeGaugeStats() {
    var logsAsc = sortedLogsAsc();
    var hasLogs = logsAsc.length > 0;
    var weightLogsAsc = metricLogs("weight");
    var hasWeight = weightLogsAsc.length > 0;
    var currentWeight = hasWeight ? weightLogsAsc[weightLogsAsc.length - 1].weight : getStartWeight();
    var remaining = currentWeight - getGoalWeight();

    var weeklyPace = null;
    if (weightLogsAsc.length >= 2) {
      var first = weightLogsAsc[0];
      var last = weightLogsAsc[weightLogsAsc.length - 1];
      var elapsedDays = daysBetween(first.date, last.date);
      var elapsedWeeks = elapsedDays / 7;
      if (elapsedWeeks > 0) {
        weeklyPace = (first.weight - last.weight) / elapsedWeeks;
      }
    }

    var etaWeeks = null;
    if (weeklyPace !== null && weeklyPace > 0) {
      etaWeeks = remaining / weeklyPace;
    }

    var streak = 0;
    if (hasLogs) {
      var byDate = {};
      state.logs.forEach(function (l) { byDate[l.date] = l; });
      var cursor = logsAsc[logsAsc.length - 1].date;
      while (byDate[cursor] && byDate[cursor].trained) {
        streak++;
        cursor = prevDateStr(cursor);
      }
    }

    var progressPct = hasWeight
      ? ((getStartWeight() - currentWeight) / (getStartWeight() - getGoalWeight())) * 100
      : 0;
    progressPct = Math.max(0, Math.min(100, progressPct));

    return {
      hasLogs: hasLogs,
      hasWeight: hasWeight,
      currentWeight: currentWeight,
      remaining: remaining,
      weeklyPace: weeklyPace,
      etaWeeks: etaWeeks,
      streak: streak,
      progressPct: progressPct,
    };
  }

  function paceEvaluation(weeklyPace, currentWeight) {
    if (weeklyPace === null) return null;
    var minPace = currentWeight * 0.008;
    var maxPace = currentWeight * 0.010;
    if (weeklyPace < 0) return { text: "増加中", cls: "over" };
    if (weeklyPace > maxPace * 1.5) return { text: "速すぎ注意", cls: "over" };
    if (weeklyPace < minPace * 0.7) return { text: "ペースやや遅め", cls: "" };
    return { text: "順調", cls: "ok" };
  }

  function drawSparkline(canvas, values) {
    var wrap = canvas.parentElement;
    var cssW = wrap.clientWidth;
    var cssH = wrap.clientHeight;
    if (cssW <= 0 || cssH <= 0) return;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    var min = Math.min.apply(null, values);
    var max = Math.max.apply(null, values);
    if (min === max) { min -= 1; max += 1; }
    var pad = 4;

    function xFor(i) { return values.length === 1 ? cssW / 2 : pad + (i / (values.length - 1)) * (cssW - pad * 2); }
    function yFor(v) { return pad + (1 - (v - min) / (max - min)) * (cssH - pad * 2); }

    var styles = getComputedStyle(document.documentElement);
    var cCyan = styles.getPropertyValue("--cyan").trim() || "#46D2C0";

    var grad = ctx.createLinearGradient(0, 0, 0, cssH);
    grad.addColorStop(0, "rgba(70,210,192,.20)");
    grad.addColorStop(1, "rgba(70,210,192,0)");
    ctx.beginPath();
    values.forEach(function (v, i) {
      var x = xFor(i), y = yFor(v);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.lineTo(xFor(values.length - 1), cssH - pad);
    ctx.lineTo(xFor(0), cssH - pad);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = cCyan;
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.beginPath();
    values.forEach(function (v, i) {
      var x = xFor(i), y = yFor(v);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  var sparkResizeBound = false;

  function renderGauge() {
    var s = computeGaugeStats();
    var el = document.getElementById("gaugePanel");
    var weightLogsAsc = metricLogs("weight");

    var paceText = s.weeklyPace === null ? "—" : (s.weeklyPace >= 0 ? "-" : "+") + fmt1(Math.abs(s.weeklyPace)) + "kg/週";
    var paceEval = paceEvaluation(s.weeklyPace, s.currentWeight);
    var etaText = "—";
    if (s.remaining <= 0 && s.hasWeight) {
      etaText = "達成!";
    } else if (s.etaWeeks !== null) {
      etaText = fmt1(s.etaWeeks) + " 週";
      if (s.etaWeeks < 260) {
        var etaDate = new Date();
        etaDate.setDate(etaDate.getDate() + Math.round(s.etaWeeks * 7));
        etaText += " (" + (etaDate.getMonth() + 1) + "/" + etaDate.getDate() + "頃)";
      }
    }
    var streakText = s.streak + " 日";

    var min = getGoalWeight();
    var max = getStartWeight();
    var span = max - min;
    var ticks = [];
    for (var t = Math.ceil(min / 5) * 5; t <= max; t += 5) {
      ticks.push(t);
    }
    var ticksHtml = ticks.map(function (tv) {
      var pct = ((tv - min) / span) * 100;
      return '<span class="tick" style="left:' + pct + '%">' + tv + '</span>';
    }).join("");

    var sparkHtml = weightLogsAsc.length >= 2 ? '<div class="spark-wrap"><canvas id="weightSpark"></canvas></div>' : '';

    el.innerHTML =
      '<div class="gauge-top">' +
        '<div class="gauge-stat">' +
          '<div class="label">現在の体重</div>' +
          '<div class="value num">' + (s.hasWeight ? fmt1(s.currentWeight) + '<small> kg</small>' : '—') + '</div>' +
        '</div>' +
        '<div class="gauge-stat accent">' +
          '<div class="label">目標まで</div>' +
          '<div class="value num">' + (s.hasWeight ? fmt1(Math.max(s.remaining, 0)) + '<small> kg</small>' : '—') + '</div>' +
        '</div>' +
      '</div>' +
      sparkHtml +
      '<div class="gauge-bar-wrap">' +
        '<div class="gauge-bar"><div class="gauge-bar-fill" style="width:' + s.progressPct + '%"></div></div>' +
        '<div class="gauge-ticks">' + ticksHtml + '</div>' +
        '<div class="gauge-labels"><span class="num">' + getGoalWeight() + 'kg (目標)</span><span class="num">' + getStartWeight() + 'kg (開始)</span></div>' +
      '</div>' +
      '<div class="stats-row">' +
        '<div class="mini-stat"><div class="label">週間ペース</div><div class="value-group"><span class="value num">' + paceText + '</span>' + (paceEval ? '<span class="pace-badge ' + paceEval.cls + '">' + paceEval.text + '</span>' : '') + '</div></div>' +
        '<div class="mini-stat"><div class="label">到達目安</div><div class="value num">' + etaText + '</div></div>' +
        '<div class="mini-stat"><div class="label">連続トレ日数</div><div class="value num">' + streakText + '</div></div>' +
      '</div>';

    if (weightLogsAsc.length >= 2) {
      var sparkCanvas = document.getElementById("weightSpark");
      drawSparkline(sparkCanvas, weightLogsAsc.slice(-14).map(function (l) { return l.weight; }));
      if (!sparkResizeBound) {
        sparkResizeBound = true;
        window.addEventListener("resize", function () {
          var c = document.getElementById("weightSpark");
          var wLogs = metricLogs("weight");
          if (c && wLogs.length >= 2) drawSparkline(c, wLogs.slice(-14).map(function (l) { return l.weight; }));
        });
      }
    }
  }

  function renderHistory() {
    var el = document.getElementById("historyList");
    var logsDesc = sortedLogsAsc().reverse();
    if (logsDesc.length === 0) {
      el.innerHTML = '<div class="empty-state">まだ記録がありません。上のフォームから追加してください。</div>';
      return;
    }
    var rows = logsDesc.map(function (l) {
      var badge = l.trained
        ? '<span class="trained-badge yes">&#9989; ジム</span>'
        : '<span class="trained-badge no">&#8212;</span>';
      var macroParts = [];
      if (hasMeals(l)) {
        macroParts.push(dayKcal(l) + "kcal");
        var p = dayProtein(l);
        if (p > 0) macroParts.push(p + "g");
      }
      var macroBadge = macroParts.length ? '<span class="macro-badge">' + macroParts.join(" / ") + '</span>' : "";
      return (
        '<div class="history-row" data-date="' + l.date + '">' +
          '<span class="date num">' + l.date + '</span>' +
          '<span class="weight num">' + (typeof l.weight === "number" ? fmt1(l.weight) + "kg" : "—") + '</span>' +
          badge +
          macroBadge +
          '<span class="spacer"></span>' +
          '<button class="del-btn" data-del="' + l.date + '" aria-label="削除">&times;</button>' +
        '</div>' +
        '<div class="history-meals" data-meals-for="' + l.date + '" hidden>' +
          (hasMeals(l)
            ? l.meals.map(function (m) {
                return '<div class="history-meal-row"><span>' + LOG_MEAL_TIME_LABEL[m.time] + '</span>' +
                  '<span class="hm-name">' + escapeHtml(m.name) + '</span>' +
                  '<span class="num">' + m.kcal + 'kcal' + (typeof m.protein === "number" ? " / P" + m.protein + "g" : "") + '</span></div>';
              }).join("")
            : '<div class="history-meal-row empty">食事の記録はありません</div>') +
        '</div>'
      );
    }).join("");

    el.querySelectorAll("[data-del]").forEach(function (btn) {

  function escapeHtml(s) {

    });

  function targetBarHtml(label, actual, target, unit) {
    var pct = target > 0 ? Math.max(0, Math.min(100, (actual / target) * 100)) : 0;
    var over = actual > target;
    return (
      '<div class="target-row">' +
        '<div class="target-row-top"><span class="target-label">' + label + '</span><span class="target-value num' + (over ? ' over' : '') + '">' + actual + ' / ' + target + unit + '</span></div>' +
        '<div class="target-bar"><div class="target-bar-fill' + (over ? ' over' : '') + '" style="width:' + pct + '%"></div></div>' +
      '</div>'
    );

  function renderTodayTargets() {
    var el = document.getElementById("todayTargetCard");
    var today = todayStr();
    var log = state.logs.find(function (l) { return l.date === today; });

    if (!hasMeals(log)) {
      el.innerHTML = '<div class="empty-state">本日の食事はまだ記録されていません。「食事を追加」から記録できます。</div>';
      return;

               targetBarHtml("タンパク質", dayProtein(log), getTargetProtein(), "g");

      var items = log.meals.filter(function (m) { return m.time === mt; });
      if (mt === "other" && items.length === 0) return;

  var currentChartMetric = "weight";
  var chartResizeBound = false;

  function metricLogs(metric) {
    if (metric === "weight") {
      return sortedLogsAsc().filter(function (l) { return typeof l.weight === "number"; });
    }
    return sortedLogsAsc().filter(hasMeals).map(function (l) {
      var copy = { date: l.date };
      copy.calories = dayKcal(l);
      copy.protein = dayProtein(l);
      return copy;
    });

  function renderChart() {
    var area = document.getElementById("chartArea");
    var logs = metricLogs(currentChartMetric);

    if (logs.length < 2) {
      var msg = currentChartMetric === "weight"
        ? "記録が2件以上になるとグラフが表示されます。"
        : "この項目の記録が2件以上になるとグラフが表示されます。";
      area.innerHTML = '<div class="empty-state">' + msg + '</div>';
      return;
    }

    if (!document.getElementById("weightChart")) {
      area.innerHTML = '<div class="chart-wrap"><canvas id="weightChart"></canvas></div>';
    }

    var canvas = document.getElementById("weightChart");
    drawChart(canvas, logs, currentChartMetric);

    if (!chartResizeBound) {
      chartResizeBound = true;
      window.addEventListener("resize", function () {
        var activeLogs = metricLogs(currentChartMetric);
        var c = document.getElementById("weightChart");

  function setupChartToggle() {
    var toggle = document.getElementById("chartToggle");
    toggle.addEventListener("click", function (e) {
      var btn = e.target.closest ? e.target.closest("[data-metric]") : null;
      if (!btn) return;
      currentChartMetric = btn.getAttribute("data-metric");
      toggle.querySelectorAll(".seg-btn").forEach(function (b) { b.classList.toggle("active", b === btn); });
      renderChart();

  function drawChart(canvas, logsAsc, metric) {
    var wrap = canvas.parentElement;
    var cssW = wrap.clientWidth;
    var cssH = wrap.clientHeight;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = cssW * dpr;
    canvas.height = cssH * dpr;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    var accessor = metric === "calories" ? function (l) { return l.calories; }
      : metric === "protein" ? function (l) { return l.protein; }
      : function (l) { return l.weight; };
    var targetVal = metric === "calories" ? getTargetCalories()
      : metric === "protein" ? getTargetProtein()
      : getGoalWeight();
    var unit = metric === "calories" ? "kcal" : metric === "protein" ? "g" : "kg";
    var seriesLabel = metric === "calories" ? "カロリー" : metric === "protein" ? "タンパク質" : "体重";
    var formatVal = metric === "weight" ? fmt1 : function (v) { return String(Math.round(v)); };

    var padL = 40, padR = 14, padT = 18, padB = 26;
    var plotW = cssW - padL - padR;
    var plotH = cssH - padT - padB;

    var values = logsAsc.map(accessor);
    var dataMin = Math.min.apply(null, values);
    var dataMax = Math.max.apply(null, values);
    var yMin = Math.min(dataMin, targetVal);
    var yMax = Math.max(dataMax, targetVal);
    if (metric === "weight") {
      yMin = Math.min(yMin, getStartWeight());
      yMax = Math.max(yMax, getStartWeight());
    }
    var yPad = Math.max((yMax - yMin) * 0.12, metric === "weight" ? 1.5 : 5);
    yMin -= yPad;
    yMax += yPad;

    function xFor(i) {
      if (logsAsc.length === 1) return padL + plotW / 2;
      return padL + (i / (logsAsc.length - 1)) * plotW;
    }
    function yFor(w) {
      return padT + (1 - (w - yMin) / (yMax - yMin)) * plotH;
    }

    var styles = getComputedStyle(document.documentElement);
    var cCyan = styles.getPropertyValue("--cyan").trim() || "#46D2C0";
    var cAmber = styles.getPropertyValue("--amber").trim() || "#E8A33D";
    var cBorder = styles.getPropertyValue("--border2").trim() || "#26333D";
    var cMuted = styles.getPropertyValue("--muted").trim() || "#7C8B96";

    ctx.strokeStyle = cBorder;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, padT);
    ctx.lineTo(padL, padT + plotH);
    ctx.lineTo(padL + plotW, padT + plotH);
    ctx.stroke();

    var goalY = yFor(targetVal);
    ctx.save();
    ctx.strokeStyle = cCyan;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(padL, goalY);
    ctx.lineTo(padL + plotW, goalY);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = cCyan;
    ctx.font = "10px " + getComputedStyle(canvas).fontFamily;
    ctx.font = "10px ui-monospace, monospace";
    ctx.textBaseline = "bottom";
    ctx.fillText("目標 " + formatVal(targetVal) + unit, padL + 4, goalY - 3);

    ctx.fillStyle = cMuted;
    ctx.font = "10px ui-monospace, monospace";
    ctx.textBaseline = "middle";
    ctx.textAlign = "right";
    var ySteps = 4;
    for (var g = 0; g <= ySteps; g++) {
      var val = yMin + (g / ySteps) * (yMax - yMin);
      var yy = yFor(val);
      ctx.fillText(formatVal(val), padL - 6, yy);
    }
    ctx.textAlign = "left";

    ctx.fillStyle = cMuted;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    var labelEvery = Math.max(1, Math.ceil(logsAsc.length / 5));
    logsAsc.forEach(function (l, i) {
      if (i % labelEvery === 0 || i === logsAsc.length - 1) {
        var shortDate = l.date.slice(5);
        ctx.fillText(shortDate, xFor(i), padT + plotH + 6);
      }
    });
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";

    ctx.strokeStyle = cAmber;
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.beginPath();
    logsAsc.forEach(function (l, i) {
      var x = xFor(i), y = yFor(accessor(l));
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    ctx.fillStyle = cAmber;
    logsAsc.forEach(function (l, i) {
      var x = xFor(i), y = yFor(accessor(l));
      ctx.beginPath();
      ctx.arc(x, y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.fillStyle = cAmber;
    ctx.font = "10px ui-monospace, monospace";
    ctx.textAlign = "right";
    ctx.textBaseline = "bottom";
    ctx.fillText(seriesLabel, padL + plotW, padT + 10);
  }

  /* ---- text normalization ---- */

  var HANKAKU_KANA_MAP = {
    'ｱ':'ア','ｲ':'イ','ｳ':'ウ','ｴ':'エ','ｵ':'オ',
    'ｶ':'カ','ｷ':'キ','ｸ':'ク','ｹ':'ケ','ｺ':'コ',
    'ｻ':'サ','ｼ':'シ','ｽ':'ス','ｾ':'セ','ｿ':'ソ',
    'ﾀ':'タ','ﾁ':'チ','ﾂ':'ツ','ﾃ':'テ','ﾄ':'ト',
    'ﾅ':'ナ','ﾆ':'ニ','ﾇ':'ヌ','ﾈ':'ネ','ﾉ':'ノ',
    'ﾊ':'ハ','ﾋ':'ヒ','ﾌ':'フ','ﾍ':'ヘ','ﾎ':'ホ',
    'ﾏ':'マ','ﾐ':'ミ','ﾑ':'ム','ﾒ':'メ','ﾓ':'モ',
    'ﾔ':'ヤ','ﾕ':'ユ','ﾖ':'ヨ',
    'ﾗ':'ラ','ﾘ':'リ','ﾙ':'ル','ﾚ':'レ','ﾛ':'ロ',
    'ﾜ':'ワ','ｦ':'ヲ','ﾝ':'ン',
    'ｧ':'ァ','ｨ':'ィ','ｩ':'ゥ','ｪ':'ェ','ｫ':'ォ',
    'ｬ':'ャ','ｭ':'ュ','ｮ':'ョ','ｯ':'ッ',
    'ｰ':'ー','､':'、','｡':'。','｢':'「','｣':'」','･':'・'
  };
  var DAKUTEN_MAP = { 'カ':'ガ','キ':'ギ','ク':'グ','ケ':'ゲ','コ':'ゴ','サ':'ザ','シ':'ジ','ス':'ズ','セ':'ゼ','ソ':'ゾ','タ':'ダ','チ':'ヂ','ツ':'ヅ','テ':'デ','ト':'ド','ハ':'バ','ヒ':'ビ','フ':'ブ','ヘ':'ベ','ホ':'ボ','ウ':'ヴ' };
  var HANDAKUTEN_MAP = { 'ハ':'パ','ヒ':'ピ','フ':'プ','ヘ':'ペ','ホ':'ポ' };

  function hwKanaToFwKana(s) {
    var out = "";
    for (var i = 0; i < s.length; i++) {
      var c = s.charAt(i);
      var mapped = HANKAKU_KANA_MAP[c];
      if (mapped) {
        var next = s.charAt(i + 1);
        if (next === 'ﾞ' && DAKUTEN_MAP[mapped]) { out += DAKUTEN_MAP[mapped]; i++; }
        else if (next === 'ﾟ' && HANDAKUTEN_MAP[mapped]) { out += HANDAKUTEN_MAP[mapped]; i++; }
        else out += mapped;
      } else {
        out += c;
      }
    }
    return out;
  }

  function normalizeText(s) {
    s = (s === null || s === undefined) ? "" : String(s);
    // hiragana -> katakana
    s = s.replace(/[ぁ-ゖ]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) + 0x60);
    });
    // full-width alnum -> half-width
    s = s.replace(/[０-９Ａ-Ｚａ-ｚ]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    });
    // half-width kana -> full-width kana
    s = hwKanaToFwKana(s);
    s = s.toLowerCase();
    s = s.replace(/^\s+|\s+$/g, "");
    return s;
  }

  /* ---- synonyms ---- */

  // Two distinct relations, deliberately kept apart:
  //
  // EQUIVALENCE — different spellings of the SAME thing. Expansion is
  // bidirectional: searching any member finds all of them.
  //
  // HYPERNYM — a category and the things inside it. Expansion is ONE-WAY:
  // searching the category ("魚") finds every member, but searching a member
  // ("鮭") must NOT drag in its siblings (さば, たら, ...). Merging these two
  // relations into one transitive cluster makes "サーモン" return every fish
  // dish in the book, which is not what someone searching for salmon wants.
  var SYNONYM_EQUIV_RAW = [
    ["鮭", "サーモン", "しゃけ", "サケ"],
    ["卵", "たまご", "玉子", "エッグ"],
    ["鶏むね", "鶏胸", "とりむね", "ムネ肉", "鶏むね肉"],
    ["鶏もも", "とりもも", "モモ肉", "鶏もも肉"],
    ["ささみ", "ササミ", "鶏ささみ"],
    ["海老", "えび", "エビ", "シュリンプ"],
    ["豚", "ポーク", "豚肉"],
    ["牛", "ビーフ", "牛肉"],
    ["豆腐", "とうふ", "トウフ"],
    ["納豆", "なっとう"],
    ["厚揚げ", "あつあげ"],
    ["高野豆腐", "こうやどうふ"],
    ["ヨーグルト", "よーぐると"],
    ["さば", "サバ", "鯖"],
    ["たら", "タラ", "鱈"],
    ["あじ", "アジ", "鯵"],
    ["まぐろ", "マグロ", "鮪", "ツナ"],
    ["いか", "イカ", "烏賊"],
    ["ほたて", "ホタテ", "帆立"],
    ["しめじ", "シメジ"],
    ["まいたけ", "マイタケ", "舞茸"],
    ["エリンギ", "えりんぎ"],
    ["しいたけ", "シイタケ", "椎茸"],
    ["激辛", "げきから", "ゲキカラ"],
    ["ピリ辛", "ぴりから", "ピリカラ"]
  ];

  var SYNONYM_HYPERNYM_RAW = [
    { term: "魚", members: ["鮭", "さば", "たら", "あじ", "まぐろ", "白身魚", "青魚", "さかな"] },
    { term: "さかな", members: ["鮭", "さば", "たら", "あじ", "まぐろ", "白身魚", "青魚"] },
    { term: "鶏肉", members: ["鶏むね", "鶏もも", "ささみ", "チキン", "鶏"] },
    { term: "チキン", members: ["鶏むね", "鶏もも", "ささみ", "鶏肉"] },
    { term: "大豆製品", members: ["豆腐", "納豆", "厚揚げ", "高野豆腐", "大豆"] },
    { term: "きのこ", members: ["しめじ", "まいたけ", "エリンギ", "しいたけ", "マッシュルーム"] },
    { term: "えび・貝", members: ["海老", "ほたて", "いか", "あさり"] },
    { term: "乳製品", members: ["ヨーグルト", "チーズ", "牛乳"] },
    { term: "辛い", members: ["ピリ辛", "激辛", "唐辛子"] },
    { term: "からい", members: ["ピリ辛", "激辛", "唐辛子"] },
    { term: "スパイシー", members: ["ピリ辛", "激辛", "唐辛子"] }
  ];

  var SYNONYM_MAP = null;

  // term -> array of equivalent spellings (transitively closed within
  // EQUIVALENCE only, so overlapping spellings stay in one class)
  function buildSynonymMap() {
    var groups = SYNONYM_EQUIV_RAW.map(function (g) { return g.map(normalizeText); });

    var parent = {};
    function find(x) {
      if (!parent.hasOwnProperty(x)) parent[x] = x;
      while (parent[x] !== x) {
        parent[x] = parent[parent[x]];
        x = parent[x];
      }
      return x;
    }
    function union(a, b) {
      var ra = find(a), rb = find(b);
      if (ra !== rb) parent[ra] = rb;
    }
    groups.forEach(function (g) {
      if (g.length === 0) return;
      find(g[0]);
      for (var i = 1; i < g.length; i++) union(g[0], g[i]);
    });

    var components = {};
    groups.forEach(function (g) {
      g.forEach(function (term) {
        var root = find(term);
        if (!components[root]) components[root] = [];
        if (components[root].indexOf(term) === -1) components[root].push(term);
      });
    });

    var map = {};
    groups.forEach(function (g) {
      g.forEach(function (term) { map[term] = components[find(term)]; });
    });
    return map;
  }

  var HYPERNYM_MAP = null;

  function buildHypernymMap() {
    var map = {};
    SYNONYM_HYPERNYM_RAW.forEach(function (entry) {
      map[normalizeText(entry.term)] = entry.members.map(normalizeText);
    });
    return map;
  }

  function equivalentsOf(termNorm) {
    if (!SYNONYM_MAP) SYNONYM_MAP = buildSynonymMap();
    var list = SYNONYM_MAP[termNorm];
    return (list && list.length > 0) ? list.slice() : [termNorm];
  }

  function expandSynonyms(termNorm) {
    if (!HYPERNYM_MAP) HYPERNYM_MAP = buildHypernymMap();

    var out = [];
    function push(t) { if (out.indexOf(t) === -1) out.push(t); }

    // always include the term's own spelling variants
    equivalentsOf(termNorm).forEach(push);

    // if the term names a category, also include everything inside it
    // (plus each member's own spelling variants) -- one way only
    var members = HYPERNYM_MAP[termNorm];
    if (members) {
      members.forEach(function (m) {
        equivalentsOf(m).forEach(push);
      });
    }
    return out;
  }

  /* ---- bigram TF-IDF index ---- */

  function getBigrams(s) {
    var out = [];
    if (!s) return out;
    if (s.length === 1) { out.push(s); return out; }
    for (var i = 0; i < s.length - 1; i++) {
      out.push(s.substr(i, 2));
    }
    return out;
  }

  var RECIPE_INDEX = null;

  function buildRecipeIndex() {
    var docs = [];
    MEAL_TIME_ORDER.forEach(function (mt) {
      MEALS[mt].forEach(function (m, idx) {
        var tags = m.tags || [];
        var rawText = m.name + " " + (m.ingredients || []).join(" ") + " " + tags.join(" ") + " " + MEAL_TIME_LABEL[mt];
        var norm = normalizeText(rawText);
        var bigrams = getBigrams(norm);
        var tf = {};
        bigrams.forEach(function (b) { tf[b] = (tf[b] || 0) + 1; });
        var tagsNorm = tags.map(normalizeText);
        docs.push({ mt: mt, idx: idx, m: m, text: norm, tf: tf, tagsNorm: tagsNorm });
      });
    });

    var df = {};
    docs.forEach(function (d) {
      var seen = {};
      for (var b in d.tf) {
        if (!d.tf.hasOwnProperty(b)) continue;
        if (!seen[b]) { df[b] = (df[b] || 0) + 1; seen[b] = true; }
      }
    });

    var N = docs.length;
    var idf = {};
    for (var b2 in df) {
      if (!df.hasOwnProperty(b2)) continue;
      idf[b2] = Math.log((1 + N) / (1 + df[b2])) + 1;
    }

    docs.forEach(function (d) {
      var vec = {};
      var sumSq = 0;
      for (var b3 in d.tf) {
        if (!d.tf.hasOwnProperty(b3)) continue;
        var w = d.tf[b3] * (idf[b3] || 0);
        vec[b3] = w;
        sumSq += w * w;
      }
      var vnorm = Math.sqrt(sumSq) || 1;
      for (var b4 in vec) {
        if (!vec.hasOwnProperty(b4)) continue;
        vec[b4] = vec[b4] / vnorm;
      }
      d.vector = vec;
    });

    return { docs: docs, idf: idf, N: N };
  }

  function ensureRecipeIndex() {
    if (!RECIPE_INDEX) RECIPE_INDEX = buildRecipeIndex();
    return RECIPE_INDEX;
  }

  function buildQueryVector(terms, idf) {
    var text = terms.join(" ");
    var bigrams = getBigrams(text);
    var tf = {};
    bigrams.forEach(function (b) { tf[b] = (tf[b] || 0) + 1; });
    var vec = {};
    var sumSq = 0;
    for (var b in tf) {
      if (!tf.hasOwnProperty(b)) continue;
      var w = tf[b] * (idf[b] || 0);
      vec[b] = w;
      sumSq += w * w;
    }
    var vnorm = Math.sqrt(sumSq) || 1;
    for (var b2 in vec) {
      if (!vec.hasOwnProperty(b2)) continue;
      vec[b2] = vec[b2] / vnorm;
    }
    return vec;
  }

  function cosineSim(vecA, vecB) {
    var sum = 0;
    for (var b in vecA) {
      if (!vecA.hasOwnProperty(b)) continue;
      if (vecB.hasOwnProperty(b)) sum += vecA[b] * vecB[b];
    }
    return sum;
  }

  function docContainsKeyword(doc, keywordNorm) {
    if (!keywordNorm) return true;
    if (doc.tagsNorm.indexOf(keywordNorm) !== -1) return true;
    if (keywordNorm.length === 1) {
      return doc.text.indexOf(keywordNorm) !== -1;
    }
    var bigrams = getBigrams(keywordNorm);
    for (var i = 0; i < bigrams.length; i++) {
      if (!doc.tf.hasOwnProperty(bigrams[i])) return false;
    }
    return true;
  }

  function keywordMatchesDoc(doc, keywordNorm) {
    var variants = expandSynonyms(keywordNorm);
    for (var i = 0; i < variants.length; i++) {
      if (docContainsKeyword(doc, variants[i])) return true;
    }
    return false;
  }

  /* ---- recipe search UI ---- */

  var RECIPE_TAG_CHIPS = ["鶏肉", "豚肉", "牛肉", "魚", "卵", "大豆製品", "和食", "洋食", "中華", "さっぱり", "ピリ辛", "激辛", "手軽", "高タンパク", "低糖質", "低カロリー", "満腹感"];

  var recipeSearch = { q: "", maxKcal: 0, minProtein: 0, tags: [] };

  function recipeSearchActive() {
    return recipeSearch.q.trim() !== "" || recipeSearch.maxKcal > 0 || recipeSearch.minProtein > 0 || recipeSearch.tags.length > 0;
  }

  function getActiveKeywords() {
    var out = [];
    var qNorm = normalizeText(recipeSearch.q);
    if (qNorm) {
      var parts = qNorm.split(/[\s　]+/);
      for (var i = 0; i < parts.length; i++) {
        if (parts[i] && out.indexOf(parts[i]) === -1) out.push(parts[i]);
      }
    }
    recipeSearch.tags.forEach(function (t) {
      var tn = normalizeText(t);
      if (tn && out.indexOf(tn) === -1) out.push(tn);
    });
    return out;
  }

  function renderRecipeSearchResults(el) {
    var index = ensureRecipeIndex();
    var keywords = getActiveKeywords();

    var queryVec = null;
    if (keywords.length > 0) {
      var expandedAll = [];
      keywords.forEach(function (k) {
        // weight the literal typed keyword more heavily than the extra
        // synonym variants it pulls in, so e.g. "サーモン" still ranks
        // salmon dishes above unrelated fish dishes reached only via a
        // shared synonym cluster (like the generic "魚" group).
        expandedAll.push(k);
        expandedAll.push(k);
        expandSynonyms(k).forEach(function (v) {
          if (v !== k) expandedAll.push(v);
        });
      });
      queryVec = buildQueryVector(expandedAll, index.idf);
    }

    var results = [];
    index.docs.forEach(function (doc) {
      var m = doc.m;
      if (recipeSearch.maxKcal > 0 && m.kcal > recipeSearch.maxKcal) return;
      if (recipeSearch.minProtein > 0 && m.protein < recipeSearch.minProtein) return;

      var score = 0;
      if (keywords.length > 0) {
        for (var i = 0; i < keywords.length; i++) {
          if (!keywordMatchesDoc(doc, keywords[i])) return;
        }
        score = cosineSim(queryVec, doc.vector);
        for (var j = 0; j < keywords.length; j++) {
          var variants = expandSynonyms(keywords[j]);
          var hit = false;
          for (var v = 0; v < variants.length; v++) {
            if (doc.tagsNorm.indexOf(variants[v]) !== -1) { hit = true; break; }
          }
          if (hit) score += 0.5;
          // extra nudge so a literal substring match of the exact typed
          // keyword (e.g. a single-kanji word like "鮭", too short to
          // carry its own bigram) still floats above merely-synonymous
          // results in the ranking.
          if (doc.text.indexOf(keywords[j]) !== -1) score += 0.2;
        }
      }

      results.push({ mt: doc.mt, idx: doc.idx, m: m, score: score, tags: (m.tags || []) });
    });

    if (keywords.length > 0) {
      results.sort(function (a, b) { return b.score - a.score; });
    }

    var countHtml = '<div class="search-count">' + results.length + '件見つかりました</div>';

    if (results.length === 0) {
      el.innerHTML = countHtml + '<div class="empty-state">条件に合うレシピが見つかりませんでした</div>';
      return;
    }

    var rowsHtml = results.map(function (r) {
      var tagsHtml = "";
      if (r.tags && r.tags.length > 0) {
        tagsHtml = '<span class="srr-tags">' + r.tags.slice(0, 5).join(" / ") + '</span>';
      }
      return (
        '<div class="search-result-row" data-mt="' + r.mt + '" data-idx="' + r.idx + '">' +
          '<span class="srr-time">' + MEAL_TIME_LABEL[r.mt] + '</span>' +
          '<span class="srr-name">' + r.m.name + '</span>' +
          '<span class="srr-macro num">' + r.m.kcal + 'kcal / ' + r.m.protein + 'g</span>' +
          tagsHtml +
          '<button class="recipe-log-btn" type="button">記録に追加</button>' +
        '</div>'
      );
    }).join("");

    el.innerHTML = countHtml + '<div class="search-result-list">' + rowsHtml + '</div>';
    bindRecipeLogButtons(el);
  }

  // Logs the recipe found at MEALS[mt][idx] as today's meal. mt/idx are
  // recovered from the data-mt/data-idx attributes already present on the
  // element that identified the recipe (meal card, search result row, or
  // the open detail modal) — no separate index is introduced.
  function logRecipe(mt, idx) {
    var recipe = MEALS[mt] && MEALS[mt][idx];
    if (!recipe) return;
    var date = todayStr();
    // the recipe's own meal-time bucket is used as-is, not the clock
    var id = addMeal(date, mt, recipe.name, recipe.kcal, recipe.protein, "recipe");
    renderAll();
    showToast("+" + recipe.kcal + "kcal / P" + recipe.protein + "g を記録しました", function () {
      removeMeal(date, id);
    });
  }

  // Recipe cards and search result rows are regenerated on every render,
  // so their "記録に追加" buttons are (re)bound right after the HTML that
  // contains them is written. Each button's enclosing element already
  // carries data-mt/data-idx (used elsewhere to open the detail modal).
  function bindRecipeLogButtons(container) {
    container.querySelectorAll(".recipe-log-btn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation(); // don't also trigger the card's modal-open handler
        var host = btn.closest("[data-mt]");
        if (!host) return;
        logRecipe(host.getAttribute("data-mt"), parseInt(host.getAttribute("data-idx"), 10));
      });
    });
  }

  function renderMeals() {

      renderRecipeSearchResults(el);
      return;

    var today = todayStr();

    var picks = {};
    var pickIdx = {};
    MEAL_TIME_ORDER.forEach(function (mt) {
      var pool = MEALS[mt];
      var idx = dailyIndex(today, mt, pool.length);
      picks[mt] = pool[idx];
      pickIdx[mt] = idx;
    });

    var totalKcal = MEAL_TIME_ORDER.reduce(function (sum, mt) { return sum + picks[mt].kcal; }, 0);
    var totalProtein = MEAL_TIME_ORDER.reduce(function (sum, mt) { return sum + picks[mt].protein; }, 0);
    var snackBudget = getTargetCalories() - totalKcal;

    var cardsHtml = MEAL_TIME_ORDER.map(function (mt) {
      var m = picks[mt];
      return (
        '<div class="meal-card" data-mt="' + mt + '" data-idx="' + pickIdx[mt] + '">' +
          '<div class="meal-time">' + MEAL_TIME_LABEL[mt] + '</div>' +
          '<div class="meal-name">' + m.name + '</div>' +
          '<div class="meal-macros">' +
            '<div class="macro"><div class="num">' + m.kcal + '</div><div class="label">kcal</div></div>' +
            '<div class="macro"><div class="num">' + m.protein + 'g</div><div class="label">protein</div></div>' +
          '</div>' +
          '<button class="recipe-log-btn" type="button">記録に追加</button>' +
          '<div class="recipe-hint">レシピを見る &gt;</div>' +
        '</div>'
      );
    }).join("");

    var snackClass = snackBudget < 0 ? "over" : "ok";
    var snackText = (snackBudget < 0 ? "-" : "") + Math.abs(snackBudget) + " kcal";

    var summaryHtml =
      '<div class="summary-card">' +
        '<div class="item"><div class="label">合計 kcal</div><div class="value num">' + totalKcal + '</div></div>' +
        '<div class="item"><div class="label">合計 protein</div><div class="value num">' + totalProtein + 'g</div></div>' +
        '<div class="item"><div class="label">間食枠 (目標 ' + getTargetCalories() + 'kcal)</div><div class="value num ' + snackClass + '">' + snackText + '</div></div>' +
      '</div>';

    var allMenuHtml = '<details class="all-menu"><summary>全メニュー一覧を見る</summary>' +
      MEAL_TIME_ORDER.map(function (mt) {
        var items = MEALS[mt].map(function (m, idx) {
          return '<div class="menu-item" data-mt="' + mt + '" data-idx="' + idx + '"><span class="mname">' + m.name + '</span><span class="mmacro num">' + m.kcal + 'kcal / ' + m.protein + 'g</span></div>';
        }).join("");
        return '<div class="menu-group"><h3>' + MEAL_TIME_LABEL[mt] + '</h3>' + items + '</div>';
      }).join("") +
    '</details>';

    el.innerHTML = summaryHtml + '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">' + cardsHtml + '</div><div style="margin-top:10px;">' + allMenuHtml + '</div>';
    bindRecipeLogButtons(el);
  }
