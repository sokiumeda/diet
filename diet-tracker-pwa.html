  function isValidDateStr(s) {
    return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
  }

  function validateImportedData(data) {
    if (!data || typeof data !== "object") return "JSONの形式が正しくありません";
    if (!Array.isArray(data.logs)) return "logsが見つかりません";
    for (var i = 0; i < data.logs.length; i++) {
      var l = data.logs[i];
      if (!l || typeof l !== "object") return "記録データの形式が正しくありません";
      if (!isValidDateStr(l.date)) return "記録に不正な日付があります (" + i + "件目)";
      if (l.weight !== undefined && (typeof l.weight !== "number" || isNaN(l.weight))) return "記録に不正な体重があります (" + i + "件目)";
      if (l.calories !== undefined && (typeof l.calories !== "number" || isNaN(l.calories))) return "記録に不正なカロリーがあります (" + i + "件目)";
      if (l.protein !== undefined && (typeof l.protein !== "number" || isNaN(l.protein))) return "記録に不正なタンパク質量があります (" + i + "件目)";
      if (l.meals !== undefined) {
        if (!Array.isArray(l.meals)) return "記録の食事データが配列ではありません (" + i + "件目)";
        for (var j = 0; j < l.meals.length; j++) {
          var m = l.meals[j];
          if (!m || typeof m !== "object") return "食事データの形式が正しくありません (" + i + "件目)";
          if (!Object.prototype.hasOwnProperty.call(LOG_MEAL_TIME_LABEL, m.time)) return "食事データに不正な食事帯があります (" + i + "件目)";
          if (typeof m.name !== "string") return "食事データに不正な名前があります (" + i + "件目)";
          if (typeof m.kcal !== "number" || isNaN(m.kcal)) return "食事データに不正なカロリーがあります (" + i + "件目)";
          if (m.protein !== undefined && (typeof m.protein !== "number" || isNaN(m.protein))) return "食事データに不正なタンパク質量があります (" + i + "件目)";
        }
      }
    }
    if (data.foods !== undefined) {
      if (!Array.isArray(data.foods)) return "foodsの形式が正しくありません";
      for (var k = 0; k < data.foods.length; k++) {
        var f = data.foods[k];
        if (!f || typeof f !== "object" || typeof f.name !== "string") return "よく食べるものの形式が正しくありません (" + k + "件目)";
        if (typeof f.kcal !== "number" || isNaN(f.kcal)) return "よく食べるもののカロリーが不正です (" + k + "件目)";
        if (f.protein !== undefined && (typeof f.protein !== "number" || isNaN(f.protein))) return "よく食べるもののタンパク質量が不正です (" + k + "件目)";
      }
    }
    if (data.profile !== undefined && data.profile !== null) {
      if (typeof data.profile !== "object" ||
          typeof data.profile.startWeight !== "number" ||
          typeof data.profile.goalWeight !== "number") {
        return "profileの形式が正しくありません";
      }
      if (data.profile.targetCalories !== undefined && typeof data.profile.targetCalories !== "number") return "profileの目標カロリーが不正です";
      if (data.profile.targetProtein !== undefined && typeof data.profile.targetProtein !== "number") return "profileの目標タンパク質が不正です";
    }
    return null;
  }

  function exportData() {
    var data = { schemaVersion: 2, logs: state.logs, foods: state.foods };

    data.exportedAt = new Date().toISOString();
    data.appVersion = APP_VERSION;
    var json = JSON.stringify(data, null, 2);
    var blob = new Blob([json], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = todayStr();
    a.href = url;
    a.download = "diet-tracker-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showDataStatus("エクスポートしました (" + state.logs.length + "件)", false);
  }

  function importDataFromFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (e) {
        showDataStatus("JSONの読み込みに失敗しました", true);
        return;
      }
      var error = validateImportedData(parsed);
      if (error) {
        showDataStatus("インポート失敗: " + error, true);
        return;
      }
      var msg = "既存の記録(" + state.logs.length + "件)を、インポートするデータ(" + parsed.logs.length + "件)で上書きします。よろしいですか?";
      if (!window.confirm(msg)) {
        showDataStatus("インポートをキャンセルしました", false);
        return;
      }
      var incoming = migrateToV2(parsed);
      state.logs = incoming.logs;
      state.foods = Array.isArray(incoming.foods) ? incoming.foods : [];
      if (incoming.profile) state.profile = incoming.profile;
      saveState();
      renderAll();
      syncSettingsInputs();
      showDataStatus("インポートしました (" + state.logs.length + "件)", false);
    };
    reader.onerror = function () {
      showDataStatus("ファイルの読み込みに失敗しました", true);
    };
    reader.readAsText(file);
  }

  function setupDataManagement() {
    document.getElementById("exportBtn").addEventListener("click", exportData);
    var fileInput = document.getElementById("importFile");
    document.getElementById("importBtn").addEventListener("click", function () {
      fileInput.value = "";
      fileInput.click();
    });
    fileInput.addEventListener("change", function () {
      var file = fileInput.files && fileInput.files[0];
      importDataFromFile(file);
    });
  }

  function setupServiceWorker() {
    if (!("serviceWorker" in navigator)) return;
    function register() {
      // relative path so registration works under GitHub Pages' /diet/ subpath
      navigator.serviceWorker.register("sw.js").catch(function () {
        /* offline caching is a best-effort enhancement; ignore failures */
      });
    }
    // the "load" event may already have fired by the time this runs, so
    // don't rely on it exclusively
    if (document.readyState === "complete") register();
    else window.addEventListener("load", register);
  }

  if (location.search.indexOf("selftest=1") >= 0) {
    SELFTEST.run();
    return;
  }

  loadState();
  setupTabs();
  setupForm();
  setupMealForm();
  setupSettings();
  setupChartToggle();
  setupRecipeModal();
  setupRecipeSearch();
  setupWelcome();
  setupDataManagement();
  setupServiceWorker();
  document.getElementById("appVersion").textContent = "v" + APP_VERSION;
  renderAll();
})();
</script>
</body>
</html>
